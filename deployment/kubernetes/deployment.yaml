apiVersion: apps/v1
kind: Deployment
metadata:
  name: lab-app
spec:
  replicas: 3
  selector:
    matchLabels:
      app: lab-app
  template:
    metadata:
      labels:
        app: lab-app
    spec:
      containers:
      - name: lab-app
        image: lab-app:production-build
        ports:
        - containerPort: 3000
        env:
        - API_KEY: ${{secrets.API_KEY}}
          run: |
            if [ -z "$API_KEY" ]; then
              echo "API_KEY is not configured"
              exit 1
            fi
            echo "API_KEY token is configured"
        - DATABASE_PASSWORD: ${DATABASE_PASSWORD}
          run: |
            if [ -z "$DATABASE_PASSWORD" ]; then
              echo "DATABASE_PASSWORD is not configured"
              exit 1
            fi
            echo "DATABASE_PASSWORD token is configured"
